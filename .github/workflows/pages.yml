# Build the static website from the library and deploy it to GitHub Pages.
#
# One-time setup in the repository settings: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Nothing else is needed; the site is generated on every push.
name: website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the library and the site's requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build the site
        run: python scripts/build_website.py --repo-url "https://github.com/${{ github.repository }}"
      - name: Check the site
        run: python scripts/check_website.py
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4