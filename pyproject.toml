[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcog"
version = "0.1.0"
description = "Q-Cog: a Qiskit-native library for simulating, explaining and visualizing quantum-probability models of human cognition, judgement and collective behaviour."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Q-Cog contributors" }]
keywords = ["quantum computing", "quantum cognition", "qiskit", "decision making", "simulation", "visualization", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "qiskit>=2.0",
  "qiskit-aer>=0.15",
]

[project.optional-dependencies]
ionq = ["qiskit-ionq>=0.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/qcog/qcog"
Documentation = "https://github.com/qcog/qcog/tree/main/docs"
Issues = "https://github.com/qcog/qcog/issues"

[project.scripts]
qcog = "qcog.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qcog = ["data/*.json", "data/*.md", "data/*.csv", "website/style/*.css"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["qcog"]